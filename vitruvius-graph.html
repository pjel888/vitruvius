<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitruvius Knowledge Graph</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1419;
    color: #e6edf3;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    padding: 12px 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  #header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #58a6ff;
  }
  #stats {
    font-size: 13px;
    color: #8b949e;
    margin-left: auto;
  }
  #filters {
    display: flex;
    gap: 8px;
  }
  .filter-btn {
    padding: 4px 12px;
    border: 1px solid #30363d;
    background: #21262d;
    color: #c9d1d9;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
  }
  .filter-btn:hover { background: #30363d; }
  .filter-btn.active {
    background: #1f6feb;
    border-color: #388bfd;
    color: #fff;
  }
  #container {
    flex: 1;
    display: flex;
    position: relative;
  }
  #network {
    flex: 1;
    background: #0f1419;
  }
  #sidebar {
    width: 340px;
    background: #161b22;
    border-left: 1px solid #30363d;
    padding: 16px;
    overflow-y: auto;
    display: none;
  }
  #sidebar.open { display: block; }
  #sidebar h2 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #58a6ff;
  }
  .prop-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #21262d;
    font-size: 13px;
  }
  .prop-key { color: #8b949e; }
  .prop-val {
    color: #c9d1d9;
    max-width: 200px;
    overflow-wrap: break-word;
    text-align: right;
  }
  #search-box {
    padding: 6px 12px;
    border: 1px solid #30363d;
    background: #0f1419;
    color: #c9d1d9;
    border-radius: 6px;
    font-size: 13px;
    width: 200px;
  }
  #search-box::placeholder { color: #484f58; }
  #loading {
    position: absolute;
    inset: 0;
    background: #0f1419;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #loading p {
    margin-top: 16px;
    color: #8b949e;
    font-size: 14px;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="header">
  <h1>🧠 Vitruvius Knowledge Graph</h1>
  <input id="search-box" type="text" placeholder="Search nodes...">
  <div id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="DocumentVersion">Documents</button>
    <button class="filter-btn" data-filter="Section">Sections</button>
    <button class="filter-btn" data-filter="Chunk">Chunks</button>
    <button class="filter-btn" data-filter="CanonicalNode">Concepts</button>
  </div>
  <div id="stats">Loading...</div>
</div>

<div id="container">
  <div id="loading">
    <div class="spinner"></div>
    <p>Connecting to Neo4j and loading graph...</p>
  </div>
  <div id="network"></div>
  <div id="sidebar">
    <h2 id="sidebar-title">Node Details</h2>
    <div id="sidebar-content"></div>
  </div>
</div>

<script>
const NEO4J_CONFIG = {
  uri: 'bolt://localhost:7687',
  user: 'neo4j',
  password: 'vitruvius'
};

let network = null;
let allNodes = [];
let allEdges = [];

function getDisplayLabel(node) {
  const p = node.properties || {};
  if (p.title) return p.title;
  if (p.label) return p.label;
  if (p.name) return p.name;
  if (p.quote) return p.quote.substring(0, 60) + (p.quote.length > 60 ? '...' : '');
  return p.id || node.id || 'Unnamed';
}

function getNodeColor(label) {
  const colors = {
    DocumentVersion: '#58a6ff',
    Section: '#3fb950',
    Chunk: '#d29922',
    EvidenceSpan: '#a371f7',
    CanonicalNode: '#f778ba',
    Assertion: '#ff7b72'
  };
  return colors[label] || '#8b949e';
}

function getNodeGroup(label) {
  return label === 'DocumentVersion' ? 1 :
         label === 'Section' ? 2 :
         label === 'Chunk' ? 3 :
         label === 'EvidenceSpan' ? 4 :
         label === 'CanonicalNode' ? 5 : 6;
}

async function loadGraph() {
  const driver = neo4j.driver(NEO4J_CONFIG.uri, neo4j.auth.basic(NEO4J_CONFIG.user, NEO4J_CONFIG.password));
  const session = driver.session();

  try {
    // Fetch all nodes
    const nodeResult = await session.run(`MATCH (n) RETURN n LIMIT 3000`);
    const nodeMap = new Map();

    nodeResult.records.forEach(record => {
      const n = record.get('n');
      const labels = n.labels;
      const label = labels[0] || 'Unknown';
      const id = n.identity.toString();
      if (!nodeMap.has(id)) {
        nodeMap.set(id, {
          id: id,
          label: getDisplayLabel({ properties: n.properties }),
          group: getNodeGroup(label),
          color: getNodeColor(label),
          title: `${label}: ${getDisplayLabel({ properties: n.properties })}`,
          properties: n.properties,
          _label: label
        });
      }
    });

    // Fetch all relationships
    const relResult = await session.run(`MATCH (a)-[r]->(b) RETURN a, r, b LIMIT 3000`);
    const edgeSet = new Set();
    const edges = [];

    relResult.records.forEach(record => {
      const from = record.get('a').identity.toString();
      const to = record.get('b').identity.toString();
      const r = record.get('r');
      const type = r.type;
      const key = `${from}-${type}-${to}`;
      if (!edgeSet.has(key)) {
        edgeSet.add(key);
        edges.push({ from, to, label: type, arrows: 'to', color: { color: '#484f58', opacity: 0.6 } });
      }
    });

    allNodes = Array.from(nodeMap.values());
    allEdges = edges;

    renderGraph(allNodes, allEdges);
    updateStats();
    document.getElementById('loading').style.display = 'none';

  } catch (err) {
    document.getElementById('loading').innerHTML = `
      <p style="color:#ff7b72">Failed to connect to Neo4j</p>
      <p style="color:#8b949e;font-size:12px">${err.message}</p>
      <p style="color:#8b949e;font-size:12px;margin-top:8px">Make sure Neo4j is running on ${NEO4J_CONFIG.uri}</p>
    `;
  } finally {
    await session.close();
    await driver.close();
  }
}

function renderGraph(nodes, edges) {
  const container = document.getElementById('network');
  const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };

  const options = {
    nodes: {
      shape: 'dot',
      size: 16,
      font: { size: 12, color: '#c9d1d9', face: 'Segoe UI' },
      borderWidth: 2,
      borderWidthSelected: 4,
      shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 10 }
    },
    edges: {
      width: 1,
      smooth: { type: 'continuous' },
      font: { size: 10, color: '#8b949e', align: 'middle' }
    },
    physics: {
      forceAtlas2Based: {
        gravitationalConstant: -50,
        centralGravity: 0.01,
        springLength: 100,
        springConstant: 0.08
      },
      maxVelocity: 50,
      solver: 'forceAtlas2Based',
      timestep: 0.35,
      stabilization: { iterations: 150 }
    },
    interaction: {
      hover: true,
      tooltipDelay: 200,
      hideEdgesOnDrag: true
    }
  };

  network = new vis.Network(container, data, options);

  network.on('click', function(params) {
    if (params.nodes.length > 0) {
      const nodeId = params.nodes[0];
      const node = allNodes.find(n => n.id === nodeId);
      showSidebar(node);
    } else {
      hideSidebar();
    }
  });
}

function showSidebar(node) {
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('sidebar-content');
  const title = document.getElementById('sidebar-title');

  title.textContent = `${node._label}: ${node.label}`;

  let html = '';
  for (const [key, val] of Object.entries(node.properties)) {
    let displayVal = val;
    if (typeof val === 'object') displayVal = JSON.stringify(val);
    if (typeof val === 'string' && val.length > 200) displayVal = val.substring(0, 200) + '...';
    html += `<div class="prop-row"><span class="prop-key">${key}</span><span class="prop-val">${displayVal}</span></div>`;
  }
  content.innerHTML = html;
  sidebar.classList.add('open');
}

function hideSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}

function updateStats() {
  const stats = document.getElementById('stats');
  stats.textContent = `${allNodes.length} nodes, ${allEdges.length} relationships`;
}

function filterGraph(type) {
  if (type === 'all') {
    network.setData({ nodes: new vis.DataSet(allNodes), edges: new vis.DataSet(allEdges) });
  } else {
    const filteredNodes = allNodes.filter(n => n._label === type);
    const nodeIds = new Set(filteredNodes.map(n => n.id));
    const filteredEdges = allEdges.filter(e => nodeIds.has(e.from) && nodeIds.has(e.to));
    network.setData({ nodes: new vis.DataSet(filteredNodes), edges: new vis.DataSet(filteredEdges) });
  }
  updateStats();
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterGraph(btn.dataset.filter);
  });
});

// Search
document.getElementById('search-box').addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase();
  if (!term) {
    network.setData({ nodes: new vis.DataSet(allNodes), edges: new vis.DataSet(allEdges) });
    return;
  }
  const matched = allNodes.filter(n => n.label.toLowerCase().includes(term));
  const matchedIds = new Set(matched.map(n => n.id));
  const connectedEdges = allEdges.filter(e => matchedIds.has(e.from) || matchedIds.has(e.to));
  network.setData({ nodes: new vis.DataSet(matched), edges: new vis.DataSet(connectedEdges) });
});

// Load on startup
loadGraph();
</script>
<script src="https://unpkg.com/neo4j-driver@5.26.0/lib/browser/neo4j-web.min.js"></script>
</body>
</html>
