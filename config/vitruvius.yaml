review:
  ollama:
    url: "http://127.0.0.1:11434"
    default_model: "gemma4:31b"
    default_timeout_seconds: 600
    max_retries_per_candidate: 3
    retry_backoff_seconds: 2
    default_parallelism: 1

promotion:
  confidence_threshold: 0.90
  audit_log_name: "latest_promotion_audit.log"

# Stream A-K feature flags — Statistical & Architectural Intelligence Upgrade.
# EVERY FLAG DEFAULTS FALSE. See .ai/03_plans/statistical-architectural-upgrade-plan.md
