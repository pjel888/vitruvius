project_name: Vitruvius
version: 0.1.0

categories:
  - 001-Laws
  - 002-History
  - 003-Theory
  - 004-Technology
  - 005-Utilities
  - 006-Structural
  - 007-Planning
  - 008-Design
  - 009-Practice

paths:
  raw: 001_Raw-Source-Layer
  conversion: 002_Raw-Conversion-Layer
  canonical: 003_Canonical-Knowledge-Layer
  derived: 004_Derived-Content-Layer
  ops: 005_Operational-Intelligence-Layer
  manifests: 006_System-Manifests

review:
  ollama:
    url: "http://127.0.0.1:11434"
    default_model: "gemma4:31b"
    default_timeout_seconds: 600
    max_retries_per_candidate: 3
    retry_backoff_seconds: 2
    default_parallelism: 1
    # NEW — Stream W1.1 model pool for 8GB survival mode.
    # Read only when features.w_llm_model_pool is true.
    model_pool:
      tier_0_draft: phi3:mini            # ~2.3 GB quantized
      tier_1_default: qwen2.5:7b         # ~4.4 GB quantized (8GB survival)
      tier_2_heavy: gemma4:31b           # ~18 GB — only on >=32 GB hosts

promotion:
  confidence_threshold: 0.90
  audit_log_name: "latest_promotion_audit.log"

# Stream A-K feature flags — Statistical & Architectural Intelligence Upgrade.
# EVERY FLAG DEFAULTS FALSE. See .ai/03_plans/statistical-architectural-upgrade-plan.md
# §3.5 for the authoritative list and §1.3 for the non-breaking contract.
# Flipping any flag to true activates the corresponding stream; flipping it
# back to false restores prior behaviour with no code rollback required.
features:
  # Stream A — Dependency bootstrap + Merkle hash + feature-flag framework
  a_merkle_hash: false
  # Stream B — Ingestion intelligence
  b_shannon_classifier: false
  b_table_graph: false
  b_parametric_ner: false
  # Stream C — Normalization Tier C
  c_tier_c_ocr_fix: false
  c_ast_chunking: false
  c_hybrid_chunking: false
  c_mahalanobis_outlier: false
  # Stream D — Concept enrichment v2
  d_tfidf_concepts: false
  d_pmi_aliases: false
  d_fca_lattice: false
  d_contrastive_embedder: false
  # Stream E — Extraction v2
  e_spacy_svo: false
  e_crf_extractor: false
  e_kg_link_prediction: false
  # Stream F — Review v2
  f_naive_bayes_filter: false
  f_slm_swarm: false
  f_ontology_embedded_prompt: false
  f_conformal_prediction: false
  f_tension_point: false
  f_self_reflection: false
  f_ollama_speculative: false
  f_ollama_kv_cache: false
  f_choquet_aggregation: false
  # Stream G — Promotion v2
  g_bayesian_fusion: false
  g_stringency_matrix: false
  g_temporal_edges: false
  # Stream H — Graph layer intelligence
  h_centrality: false
  h_spectral: false
  h_community: false
  h_mcmc: false
  h_tda: false
  h_wasserstein: false
  h_causal_dag: false
  h_tensor_factorisation: false
  # Stream I — Query layer v2
  i_ontology_nl_translator: false
  i_graphrag_routing: false
  i_mcmc_ranking: false
  i_hmm_observability: false
  # Stream J — Active learning
  j_active_learning: false
  j_expected_model_change: false
  # Stream K — CLUP scaling foundation
  k_rosetta_stone: false
  k_jurisdictional_overrides: false
  # Stream L — Spatial Ingestion + Z3 Solver (3D Spatial Intelligence Upgrade)
  l_spatial_ingestion: false
  l_z3_constraint_solver: false
  # Stream M — IFC/OWL Ontology
  m_ifc_ontology_mapping: false
  m_owl_turtle_export: false
  # Stream N — Spatial Daemon integration marker
  n_spatial_daemon_enabled: false
  # Stream O — Epistemic Foraging Scaffold
  o_watched_sources_registry: false
  o_mahalanobis_drift_detection: false
  o_duplicate_detector: false
  # Stream W — Live Wiring & 8GB Hardening (live-wiring-and-8gb-hardening-plan.md)
  # Every flag defaults false. With all off, the pipeline behaviour is
  # byte-identical to the pre-Sprint-Q baseline.
  w_llm_model_pool: false
  w_llm_num_ctx_enforcement: false
  w_llm_context_budget_guard: false
  w_llm_binary_mode: false
  w_review_nb_prefilter: false
  w_review_ontology_prompt: false
  w_review_slm_routing: false
  w_review_conformal_routing: false
  w_review_tension_reflection: false
  w_review_choquet_aggregator: false
  w_promotion_stringency_gate: false
  w_graph_governing_standard: false
