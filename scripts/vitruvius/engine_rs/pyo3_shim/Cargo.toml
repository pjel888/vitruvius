[package]
name = "vitruvius_engine_rs"
version = "0.1.0"
edition = "2021"
description = "Vitruvius Sprint GT Rust data plane — pyo3 shim over core crate."
license = "MIT OR Apache-2.0"

[lib]
name = "vitruvius_engine_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
vitruvius_engine_rs_core = { path = "../core" }
# Sprint RUST-MIG-1 Task 4 — re-export the kernel crates through the
# same pyo3 shim so Python sees one extension module. The shim crate
# stays the single CPython link point; the kernel crates are pure Rust.
vitruvius_spatial_kernels = { path = "../spatial_kernels" }
# Sprint RUST-MIG-1 Task 6 — N4 Mahalanobis lives in stats_kernels.
# Same polyglot rationale as spatial_kernels: one CPython link point,
# one wheel, one import line on the Python side.
vitruvius_stats_kernels = { path = "../stats_kernels" }

