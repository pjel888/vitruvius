[package]
name = "vitruvius_engine_rs"
version = "0.1.0"
edition = "2021"
description = "Vitruvius Sprint GT Rust data plane — sparse linear octree + pyo3 bridge."
license = "MIT OR Apache-2.0"

[lib]
name = "vitruvius_engine_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
