[package]
name = "vitruvius_datalog_rs"
version = "0.1.0"
edition = "2021"
description = "Vitruvius Sprint Z Stream S1 — hand-rolled Datalog evaluator + pyo3 bridge for neuro-symbolic compliance proofs."
license = "MIT OR Apache-2.0"

[lib]
name = "vitruvius_datalog_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
