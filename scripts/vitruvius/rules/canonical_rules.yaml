version: 1

# --------------------------------------------------
# GLOBAL DEFAULTS
# --------------------------------------------------

defaults:
  unknown:
    source_type: unknown
    trust_level: unknown
    canonical_title_strategy: "filename"
    aliases: []
    relationships: []
    core_concepts: []

# --------------------------------------------------
# RULES
# --------------------------------------------------

rules:

  # --------------------------------------------------
  # PD 1096 - NATIONAL BUILDING CODE (LAW)
  # --------------------------------------------------
  - name: "PD 1096 Law"

    match:
      all_contains:
        - "pd"
        - "1096"
      any_contains:
        - "building code"
        - "national building code"
      not_contains:
        - "irr"

    classification:
      source_type: law
      trust_level: primary

    canonical:
      title: "National Building Code of the Philippines"

      aliases:
        - "PD 1096"
        - "Presidential Decree No. 1096"
        - "National Building Code"

      relationships:
        implemented_by:
          - "irr-implementing-rules-and-regulations-of-the-national-building-code"

      core_concepts:
        - "occupancy classification"
        - "building permits"
        - "fire-resistive construction"
        - "light and ventilation"
        - "setbacks"

  # --------------------------------------------------
  # PD 1096 IRR
  # --------------------------------------------------
  - name: "PD 1096 IRR"

    match:
      all_contains:
        - "pd"
        - "1096"
        - "irr"

    classification:
      source_type: irr
      trust_level: primary

    canonical:
      title: "Implementing Rules and Regulations of the National Building Code"

      aliases:
        - "PD 1096 IRR"
        - "National Building Code IRR"
        - "Revised IRR 2004"

      relationships:
        implements:
          - "law-national-building-code-of-the-philippines"

      core_concepts:
        - "occupancy classification"
        - "building permits"
        - "fire-resistive construction"
        - "light and ventilation"
        - "setbacks"

  # --------------------------------------------------
  # GENERIC LAW SECTION
  # --------------------------------------------------
  - name: "Generic Law Section"

    match:
      any_contains:
        - "section"
        - "rule"
        - "article"

    classification:
      source_type: law_section
      trust_level: primary

    canonical:
      title_strategy: "filename"

      core_concepts:
        - "to-be-derived"

  # --------------------------------------------------
  # HANDOUT / LECTURE MATERIAL
  # --------------------------------------------------
  - name: "Handout / Lecture"

    match:
      any_contains:
        - "handout"
        - "lecture"

    classification:
      source_type: handout
      trust_level: study_aid

    canonical:
      title_strategy: "filename"

  # --------------------------------------------------
  # REVIEWERS / SUMMARIES
  # --------------------------------------------------
  - name: "Reviewer / Summary"

    match:
      any_contains:
        - "reviewer"
        - "summary"

    classification:
      source_type: reviewer
      trust_level: educational

    canonical:
      title_strategy: "filename"