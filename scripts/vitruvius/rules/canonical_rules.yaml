  # --------------------------------------------------
  # GENERIC LAW SECTION
  # --------------------------------------------------
  - name: "Generic Law Section"

    match:
      any_contains:
        - "section"
        - "rule"
        - "article"

    classification:
      source_type: law_section
      trust_level: primary

    canonical:
      title_strategy: "filename"

      core_concepts:
        - "to-be-derived"

  # --------------------------------------------------
  # HANDOUT / LECTURE MATERIAL
  # --------------------------------------------------
  - name: "Handout / Lecture"

    match:
